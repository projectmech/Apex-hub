<!DOCTYPE html>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-cyan-glow: rgba(6, 182, 212, 0.35);
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.35);
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --input-bg: rgba(10, 15, 26, 0.6);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }

    body {
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .app-container {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      width: 100%;
      max-width: 480px;
      padding: 2rem;
      border-radius: 2rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .input-group { margin-bottom: 1rem; text-align: left; }
    label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.4rem; }

    input, select {
      width: 100%; padding: 0.85rem 1rem; border-radius: 1rem; border: 1px solid var(--card-border);
      background: var(--input-bg); color: var(--text-main); font-size: 0.875rem; outline: none; transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan-glow);
    }

    .btn {
      width: 100%; padding: 0.9rem; border-radius: 1rem; border: none;
      background: linear-gradient(135deg, #06b6d4, #0891b2); color: #fff; font-size: 0.875rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px var(--accent-cyan-glow);
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .btn:active { transform: translateY(1px); }

    .btn-secondary { background: rgba(255, 255, 255, 0.06); color: var(--text-main); border: 1px solid var(--card-border); box-shadow: none; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }

    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); box-shadow: none; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.6rem 1rem;
      border-radius: 2rem;
      border: 1px solid var(--card-border);
      margin-bottom: 1.25rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); box-shadow: 0 0 8px var(--warning); }
    .status-badge.connected .status-dot { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

      background: rgba(10, 15, 26, 0.5);
      border: 1px solid var(--card-border);
      padding: 0.85rem;
      border-radius: 1.25rem;
      text-align: center;

      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-cyan);
      margin-top: 0.2rem;
    }

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .control-grid .btn { padding: 0.75rem 0.2rem; font-size: 0.775rem; }

    .console-box {
      background: #04060a;
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 0.8rem;
      font-family: "SF Mono", monospace;

      margin-top: 1rem;

    .btn-light-on {
      background: #dc2626 !important;
      color: white !important;
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.6);

  <script>
/**
 * Segway-Ninebot Encryption2 protocol — crypto module (JS port)
 *
 * Ported directly from the documented Python reference implementation at
 * https://nootnooot.codeberg.page/segway-ninebot-ble/encryption/
 *
 * IMPORTANT CAVEAT: the source project's own Python CLI explicitly states
 * it has "never been tested against a real Segway-Ninebot vehicle" — only
 * internal round-trip self-tests pass. This port follows that spec as
 * faithfully as possible, but has NOT been confirmed against real hardware
 * either. Treat this as a first attempt to validate, not a proven client.
 *
 * Requires a browser with Web Crypto (crypto.subtle) — true of any modern
 * browser that also supports Web Bluetooth.
 */

const SegwayCrypto = (() => {

  // ---- AES-128-ECB single-block encrypt, built on top of Web Crypto's
  // AES-CBC (which IS available) using a zero IV. For a single 16-byte
  // input block, AES-CBC(zeroIV) on that one block is byte-identical to
  // ECB on that block, since CBC only differs from ECB by XOR-ing the IV
  // into the FIRST block — with IV=0 that XOR is a no-op. We only ever
  // need to encrypt exactly one block at a time here, so this is exact,
  // not an approximation. ----
  async function importAesKey(rawKeyBytes) {
    return crypto.subtle.importKey(
      'raw', rawKeyBytes, { name: 'AES-CBC' }, false, ['encrypt']
    );
  }

  async function aesEcbEncryptBlock(cryptoKey, block16) {
    const zeroIv = new Uint8Array(16);
    const ciphertext = await crypto.subtle.encrypt(
      { name: 'AES-CBC', iv: zeroIv }, cryptoKey, block16
    );
    // AES-CBC always PKCS7-pads; a 16-byte input becomes 32 bytes output
    // (input block + a full padding block). The first 16 bytes are the
    // real ECB-encrypted block we want; the second 16 are padding noise.
    return new Uint8Array(ciphertext).slice(0, 16);
  }

  // ---- Key derivation: SHA-1(key1_pad16 || key2_pad16)[0:16] ----
  function pad16(bytes) {
    const out = new Uint8Array(16);
    if (bytes) out.set(bytes.slice(0, 16));
    return out;
  }

  async function deriveKey(key1Bytes, key2BytesOrNull) {
    const k1 = pad16(key1Bytes);
    const k2 = key2BytesOrNull ? pad16(key2BytesOrNull) : new Uint8Array(16);
    const combined = new Uint8Array(32);
    combined.set(k1, 0);
    combined.set(k2, 16);
    const hash = await crypto.subtle.digest('SHA-1', combined);
    return new Uint8Array(hash).slice(0, 16);
  }

  // ---- Nonce: counter_BE[4] || auth[0:8] || 0x00  (13 bytes) ----
  function buildNonce(counter, authParam) {
    const nonce = new Uint8Array(13);
    nonce[0] = (counter >>> 24) & 0xFF;
    nonce[1] = (counter >>> 16) & 0xFF;
    nonce[2] = (counter >>> 8) & 0xFF;
    nonce[3] = counter & 0xFF;
    nonce.set(authParam.slice(0, 8), 4);
    nonce[12] = 0x00;
    return nonce;
  }

  function xorBytes(a, b) {
    const out = new Uint8Array(a.length);
    for (let i = 0; i < a.length; i++) out[i] = a[i] ^ (b[i] || 0);
    return out;
  }

  // ---- CBC-MAC over [header(3) as AAD] + [payload], per the documented algorithm ----
  async function cbcMac(cryptoKey, plaintext, nonce) {
    const payload = plaintext.slice(3);
    const payloadLen = payload.length;

    let b0 = new Uint8Array(16);
    b0[0] = 0x59;
    b0.set(nonce, 1);
    b0[14] = 0x00;
    b0[15] = payloadLen & 0xFF;
    let x = await aesEcbEncryptBlock(cryptoKey, b0);

    const aad = new Uint8Array(16);
    aad.set(plaintext.slice(0, 3), 0);
    x = await aesEcbEncryptBlock(cryptoKey, xorBytes(x, aad));

    for (let off = 0; off < payload.length; off += 16) {
      const chunk = new Uint8Array(16);
      chunk.set(payload.slice(off, off + 16));
      x = await aesEcbEncryptBlock(cryptoKey, xorBytes(x, chunk));
    }

    return x.slice(0, 4);
  }

  // ---- SN-mode encrypt: full algorithm from the docs ----
  async function encryptSn(cryptoKey, plaintext, counter, authParam) {
    const nonce = buildNonce(counter, authParam);
    const header = plaintext.slice(0, 3);
    const payload = plaintext.slice(3);

    const rawTag = await cbcMac(cryptoKey, plaintext, nonce);

    const ctBytes = new Uint8Array(payload.length);
    for (let i = 1; i <= Math.ceil(payload.length / 16); i++) {
      const aI = new Uint8Array(16);
      aI[0] = 0x01;
      aI.set(nonce, 1);
      aI[14] = 0x00;
      aI[15] = i & 0xFF;
      const ks = await aesEcbEncryptBlock(cryptoKey, aI);
      const start = (i - 1) * 16;
      const blockLen = Math.min(16, payload.length - start);
      for (let j = 0; j < blockLen; j++) {
        ctBytes[start + j] = payload[start + j] ^ ks[j];
      }
    }

    const a0 = new Uint8Array(16);
    a0[0] = 0x01;
    a0.set(nonce, 1);
    a0[14] = 0x00;
    a0[15] = 0x00;
    const a0ks = await aesEcbEncryptBlock(cryptoKey, a0);
    const encTag = xorBytes(rawTag, a0ks.slice(0, 4));

    const counterBE = new Uint8Array(2);
    counterBE[0] = (counter >>> 8) & 0xFF;
    counterBE[1] = counter & 0xFF;

    const out = new Uint8Array(header.length + ctBytes.length + encTag.length + counterBE.length);
    let pos = 0;
    out.set(header, pos); pos += header.length;
    out.set(ctBytes, pos); pos += ctBytes.length;
    out.set(encTag, pos); pos += encTag.length;
    out.set(counterBE, pos);
    return out;
  }

  // ---- SN-mode decrypt (inverse) ----
  async function decryptSn(cryptoKey, ciphertext, authParam) {
    const header = ciphertext.slice(0, 3);
    const body = ciphertext.slice(3, ciphertext.length - 6);
    const encTag = ciphertext.slice(ciphertext.length - 6, ciphertext.length - 2);
    const counterBytes = ciphertext.slice(ciphertext.length - 2);
    const counter = (counterBytes[0] << 8) | counterBytes[1];

    const nonce = buildNonce(counter, authParam);

    const plainBody = new Uint8Array(body.length);
    for (let i = 1; i <= Math.ceil(body.length / 16); i++) {
      const aI = new Uint8Array(16);
      aI[0] = 0x01;
      aI.set(nonce, 1);
      aI[14] = 0x00;
      aI[15] = i & 0xFF;
      const ks = await aesEcbEncryptBlock(cryptoKey, aI);
      const start = (i - 1) * 16;
      const blockLen = Math.min(16, body.length - start);
      for (let j = 0; j < blockLen; j++) {
        plainBody[start + j] = body[start + j] ^ ks[j];
      }
    }

    const a0 = new Uint8Array(16);
    a0[0] = 0x01;
    a0.set(nonce, 1);
    a0[14] = 0x00;
    a0[15] = 0x00;
    const a0ks = await aesEcbEncryptBlock(cryptoKey, a0);
    const rawTag = xorBytes(encTag, a0ks.slice(0, 4));

    const fullPlaintext = new Uint8Array(3 + plainBody.length);
    fullPlaintext.set(header, 0);
    fullPlaintext.set(plainBody, 3);

    const expectedTag = await cbcMac(cryptoKey, fullPlaintext, nonce);
    let macOk = true;
    for (let i = 0; i < 4; i++) if (expectedTag[i] !== rawTag[i]) macOk = false;

    return { plaintext: fullPlaintext, counter, macOk };
  }

  // ---- Non-SN-mode encrypt/decrypt (counter == 0) — used for PRE_COMM,
  // before any auth parameter exists yet. Static keystream + 16-bit
  // checksum, NOT CBC-MAC. Documented as weaker (identical plaintext
  // blocks -> identical ciphertext blocks) but that's what PRE_COMM uses.
  function computeChecksum(payload) {
    let sum = 0;
    for (let i = 0; i < payload.length; i++) sum += payload[i];
    return (~sum) & 0xFFFF;
  }

  async function encryptNonSn(cryptoKey, plaintext) {
    const header = plaintext.slice(0, 3);
    const payload = plaintext.slice(3);
    const checksum = computeChecksum(payload);

    const zeros = new Uint8Array(16);
    const keystream = await aesEcbEncryptBlock(cryptoKey, zeros);

    const ct = new Uint8Array(payload.length);
    for (let i = 0; i < payload.length; i++) {
      ct[i] = payload[i] ^ keystream[i % 16];
    }

    const out = new Uint8Array(3 + ct.length + 6);
    out.set(header, 0);
    out.set(ct, 3);
    // tail: 0x00 0x00 checksum_lo checksum_hi 0x00 0x00
    out[3 + ct.length + 0] = 0x00;
    out[3 + ct.length + 1] = 0x00;
    out[3 + ct.length + 2] = checksum & 0xFF;
    out[3 + ct.length + 3] = (checksum >> 8) & 0xFF;
    out[3 + ct.length + 4] = 0x00;
    out[3 + ct.length + 5] = 0x00;
    return out;
  }

  async function decryptNonSn(cryptoKey, ciphertext) {
    const header = ciphertext.slice(0, 3);
    const body = ciphertext.slice(3, ciphertext.length - 6);
    const tail = ciphertext.slice(ciphertext.length - 6);
    const expectedChecksum = tail[2] | (tail[3] << 8);

    const zeros = new Uint8Array(16);
    const keystream = await aesEcbEncryptBlock(cryptoKey, zeros);

    const plainBody = new Uint8Array(body.length);
    for (let i = 0; i < body.length; i++) {
      plainBody[i] = body[i] ^ keystream[i % 16];
    }

    const actualChecksum = computeChecksum(plainBody);
    const checksumOk = actualChecksum === expectedChecksum;

    const fullPlaintext = new Uint8Array(3 + plainBody.length);
    fullPlaintext.set(header, 0);
    fullPlaintext.set(plainBody, 3);

    return { plaintext: fullPlaintext, checksumOk };
  }

  // ---- Java util.Random LCG, needed for session-password generation.
  // Uses BigInt throughout to avoid float-precision issues at 48 bits. ----
  class JavaRandom {
    constructor(seed) {
      const MULTIPLIER = 0x5DEECE66Dn;
      const MASK = (1n << 48n) - 1n;
      this.MULTIPLIER = MULTIPLIER;
      this.ADDEND = 0xBn;
      this.MASK = MASK;
      this.seed = (BigInt(seed) ^ MULTIPLIER) & MASK;
    }
    next(bits) {
      this.seed = (this.seed * this.MULTIPLIER + this.ADDEND) & this.MASK;
      // >>> (48 - bits), as a 32-bit signed result like Java's int
      let shifted = this.seed >> BigInt(48 - bits);
      // reduce to 32-bit range then treat as signed int32
      let val = Number(shifted & 0xFFFFFFFFn);
      if (val > 0x7FFFFFFF) val -= 0x100000000;
      return val;
    }
    nextBytes(len) {
      const out = new Uint8Array(len);
      let i = 0;
      while (i < len) {
        let rnd = this.next(32);
        for (let n = Math.min(len - i, 4); n > 0; n--) {
          out[i++] = rnd & 0xFF;
          rnd = rnd >> 8;
        }
      }
      return out;
    }
  }

  async function generateSessionPassword(authParam, timeMs) {
    if (timeMs === undefined) timeMs = Date.now();
    let seedValue = 0;
    for (let i = 0; i < authParam.length; i++) {
      let b = authParam[i];
      const signedByte = b < 128 ? b : b - 256;
      const shift = (i % 8) * 8;
      // Java int shift wraps at 32 bits
      const val = (signedByte << (shift & 31)) | 0;
      seedValue = (seedValue + val) | 0;
    }
    const seed = timeMs + seedValue;
    const rng = new JavaRandom(seed);
    const randomBytes = rng.nextBytes(16);
    const hash = await crypto.subtle.digest('SHA-256', randomBytes);
    return new Uint8Array(hash).slice(0, 16);
  }

  return {
    importAesKey,
    aesEcbEncryptBlock,
    deriveKey,
    buildNonce,
    encryptSn,
    decryptSn,
    encryptNonSn,
    decryptNonSn,
    generateSessionPassword,
    JavaRandom
  };
})();

  </script>

  <script>

        LOCK: [new Uint8Array([0x55, 0xAA, 0x05, 0x20, 0x01, 0x70, 0x00, 0x00, 0x6A, 0xFF])],
        LIGHT_ON: [new Uint8Array([0x55, 0xAA, 0x04, 0x20, 0x01, 0x7D, 0x02, 0x5A, 0xFF])],
        LIGHT_OFF: [new Uint8Array([0x55, 0xAA, 0x04, 0x20, 0x01, 0x7D, 0x00, 0x5C, 0xFF])],
        ECO: [new Uint8Array([0x55, 0xAA, 0x05, 0x20, 0x01, 0x72, 0x00, 0x00, 0x68, 0xFF])],
        SPORT: [new Uint8Array([0x55, 0xAA, 0x05, 0x20, 0x01, 0x72, 0x03, 0x00, 0x65, 0xFF])],
        BEEP: [new Uint8Array([0x55, 0xAA, 0x04, 0x20, 0x01, 0x71, 0x01, 0x67, 0xFF])]
      },
      snsc: {
        UNLOCK: [new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x70, 0x00, 0x6B, 0xFF]), new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x78, 0x00, 0x63, 0xFF])],
        LOCK: [new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x70, 0x01, 0x6A, 0xFF]), new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x78, 0x01, 0x62, 0xFF])],
        LIGHT_ON: [new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x7D, 0x02, 0x5C, 0xFF])],
        LIGHT_OFF: [new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x7D, 0x00, 0x5E, 0xFF])],
        ECO: [new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x72, 0x00, 0x69, 0xFF])],
        SPORT: [new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x72, 0x02, 0x67, 0xFF])],
        BEEP: [new Uint8Array([0x55, 0xAA, 0x03, 0x20, 0x01, 0x71, 0x01, 0x69, 0xFF])]
      },
      xiaomi: {
        UNLOCK: [new Uint8Array([0x55, 0xAB, 0x01, 0x00, 0x20, 0x01, 0x00, 0x21])],
        LOCK: [new Uint8Array([0x55, 0xAB, 0x01, 0x00, 0x20, 0x01, 0x01, 0x20])],
        LIGHT_ON: [new Uint8Array([0x55, 0xAB, 0x01, 0x00, 0x0C, 0x01, 0x01, 0x0D])],
        LIGHT_OFF: [new Uint8Array([0x55, 0xAB, 0x01, 0x00, 0x0C, 0x01, 0x00, 0x0E])],
        ECO: [new Uint8Array([0x55, 0xAB, 0x01, 0x00, 0x02, 0x01, 0x00, 0x03])],
        SPORT: [new Uint8Array([0x55, 0xAB, 0x01, 0x00, 0x02, 0x01, 0x02, 0x01])],
        BEEP: [new Uint8Array([0x55, 0xAB, 0x01, 0x00, 0x1A, 0x01, 0x01, 0x1A])]
      },
      kukirin: {
        UNLOCK: [new Uint8Array([0xA5, 0x5A, 0x04, 0x01, 0x01, 0x01, 0x06, 0xAA])],
        LOCK: [new Uint8Array([0xA5, 0x5A, 0x04, 0x01, 0x01, 0x00, 0x05, 0xAA])],
        LIGHT_ON: [new Uint8Array([0xA5, 0x5A, 0x04, 0x02, 0x01, 0x01, 0x07, 0xAA])],
        LIGHT_OFF: [new Uint8Array([0xA5, 0x5A, 0x04, 0x02, 0x01, 0x00, 0x06, 0xAA])],
        ECO: [new Uint8Array([0xA5, 0x5A, 0x04, 0x03, 0x01, 0x01, 0x08, 0xAA])],
        SPORT: [new Uint8Array([0xA5, 0x5A, 0x04, 0x03, 0x01, 0x03, 0x0A, 0xAA])],
        BEEP: [new Uint8Array([0xA5, 0x5A, 0x04, 0x05, 0x01, 0x01, 0x0A, 0xAA])]
      },
      // Gen-3 / Gen-3S / Gen-3Sg speaker-tracker module — PLACEHOLDER ONLY.
      // These are NOT real captured bytes. The spec sheet (dimensions,
      // weight, speaker dB, battery mAh) tells us nothing about the actual
      // BLE command format, which varies device-to-device and has to come
      // from real traffic. Capture with nRF Connect's log export or a
      // Wireshark Bluetooth snoop log while using the vendor's app, then
      // replace every TODO array below with the real bytes you find.
      // Structure/style kept identical to the profiles above so it drops
      // in the same way once you have real data.
      gen3: {
        UNLOCK: [new Uint8Array([/* TODO: real bytes here */])],
        LOCK: [new Uint8Array([/* TODO: real bytes here */])],
        LIGHT_ON: [new Uint8Array([/* TODO: real bytes here */])],
        LIGHT_OFF: [new Uint8Array([/* TODO: real bytes here */])],
        ECO: [new Uint8Array([/* TODO: real bytes here */])],
        SPORT: [new Uint8Array([/* TODO: real bytes here */])],
        BEEP: [new Uint8Array([/* TODO: real bytes here */])]
      },
      // UIFP (Universal IoT Frame Protocol) — our own generic frame format,
      // for talking to the micro:bit/ESP32 reference devices rather than a
      // real named scooter brand. See UIFP-protocol-spec.md. Frame shape:
      // [0xA5][deviceType=0x01][frameType=0x02 COMMAND][len=1][cmd][checksum][0xFF]
      ble: {
        UNLOCK: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x01, 0xA6, 0xFF])],
        LOCK: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x02, 0xA5, 0xFF])],
        LIGHT_ON: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x04, 0xA3, 0xFF])],
        LIGHT_OFF: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x05, 0xA2, 0xFF])],
        ECO: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x06, 0xA1, 0xFF])],
        SPORT: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x07, 0xA0, 0xFF])],
        BEEP: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x03, 0xA4, 0xFF])]
      },
      uart: {
        UNLOCK: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x01, 0xA6, 0xFF])],
        LOCK: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x02, 0xA5, 0xFF])],
        LIGHT_ON: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x04, 0xA3, 0xFF])],
        LIGHT_OFF: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x05, 0xA2, 0xFF])],
        ECO: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x06, 0xA1, 0xFF])],
        SPORT: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x07, 0xA0, 0xFF])],
        BEEP: [new Uint8Array([0xA5, 0x01, 0x02, 0x01, 0x03, 0xA4, 0xFF])]
      }
    };

    let gattDevice, gattServer, txCharacteristic, rxCharacteristic;
    let lightState = false;

    const consoleBox = document.getElementById('activity-console');
    const statusPill = document.getElementById('status-pill');
    const statusText = document.getElementById('status-text');

    function logToConsole(text, type = '') {
      const entry = document.createElement('div');
      entry.className = `console-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      consoleBox.appendChild(entry);
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    async function sha256(str) {
      const buffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputPass = document.getElementById('password').value;
      if (await sha256(inputPass) === TARGET_PASS_HASH) {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('connect-view').classList.remove('hidden');
      }
    });

    // getPrimaryServices() called immediately after gatt.connect() can race
    // the underlying link on some Chrome/OS combos and get "GATT Server is
    // disconnected" even though the connection just succeeded. Retry a few
    // times with a short backoff before giving up.
    async function connectGattWithRetry(server, maxAttempts = 5) {
      let lastErr;
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          return await server.getPrimaryServices();
        } catch (err) {
          lastErr = err;
          logToConsole(`getPrimaryServices attempt ${attempt} failed: ${err.message}`, 'warn');
          await new Promise(resolve => setTimeout(resolve, 250 * attempt));
          if (!server.connected) {
            // link actually dropped — reconnect before the next attempt
            server = await server.device.gatt.connect();
            gattServer = server;
          }
        }
      }
      throw lastErr;
    }

    document.getElementById('btn-connect').addEventListener('click', async () => {
      try {
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        // Real Ninebot Custom service, per the reverse-engineered transport docs —
        // different from the generic Nordic UART UUID above, and needed to see
        // modern Segway/Ninebot vehicles in the device picker at all.
        const NINEBOT_CUSTOM_SERVICE_UUID = "6e400001-0000-0000-006e-696e65626f74";
        const connectionMode = document.getElementById('scooter-brand-select').value;

        let requestOptions;
        if (connectionMode === 'uart') {
          // Targeted: only shows devices actually advertising the Nordic
          // UART service in the picker, connects straight to it.
          requestOptions = {
            filters: [{ services: [UART_SERVICE_UUID] }],
            optionalServices: [UART_SERVICE_UUID]
          };
        } else if (connectionMode === 'segway-enc2') {
          requestOptions = {
            acceptAllDevices: true,
            optionalServices: [NINEBOT_CUSTOM_SERVICE_UUID, UART_SERVICE_UUID]
          };
        } else {
          // Broad: any device, try this known list of common serial/UART-
          // style service UUIDs used across "ble", "generic", and the named
          // scooter protocols.
          requestOptions = {
            acceptAllDevices: true,
            optionalServices: [
              "0000ffe5-0000-1000-8000-00805f9b34fb",
              UART_SERVICE_UUID,
              "0000ffe0-0000-1000-8000-00805f9b34fb",
              "0000fcc0-0000-1000-8000-00805f9b34fb"
            ]
          };
        }

        gattDevice = await navigator.bluetooth.requestDevice(requestOptions);

        gattServer = await gattDevice.gatt.connect();
        gattDevice.addEventListener('gattserverdisconnected', () => {
          resetToConnectView();
        });

        // give the link a brief moment to stabilize before enumerating
        // services — this is what actually avoids the race in most cases
        await new Promise(resolve => setTimeout(resolve, 300));

        document.getElementById('connect-view').classList.add('hidden');
        document.getElementById('controls-view').classList.remove('hidden');
        logToConsole(`Link Established: ${gattDevice.name || 'Vehicle ESC'}`);

        const services = await connectGattWithRetry(gattServer);
        for (let s of services) {
          const chars = await s.getCharacteristics();
          for (let c of chars) {
            if (c.properties.write || c.properties.writeWithoutResponse) txCharacteristic = c;
            if (c.properties.notify || c.properties.indicate) rxCharacteristic = c;
          }
        }

        if (rxCharacteristic) {
          await rxCharacteristic.startNotifications();
          rxCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingESCData);
          logToConsole('2-Way Protocol Stream Active', 'success');
        }

        // Key field is optional now — only send something if it's actually
        // filled in. Leaving it blank just connects with no auth attempt,
        // useful for real scooter protocols that don't use this key scheme.
        // Only sent as a UIFP AUTH frame when targeting our own devices
        // (Plain BLE / Plain UART) — real named scooter protocols
        // (Apex/SNSC/Xiaomi/Kukirin) don't understand this frame at all.
        const keyInput = document.getElementById('shared-key').value.trim();
        const isUifpTarget = (connectionMode === 'ble' || connectionMode === 'uart');
        if (keyInput && txCharacteristic && isUifpTarget) {
          if (!/^[0-9a-fA-F]+$/.test(keyInput) || keyInput.length % 2 !== 0 || keyInput.length !== 16) {
            logToConsole('Key ignored: must be exactly 16 hex characters (8 bytes)', 'error');
          } else {
            try {
              const keyBytes = keyInput.match(/.{1,2}/g).map(byte => parseInt(byte, 16));
              // UIFP AUTH frame: [0xA5][deviceType=0x01][frameType=0x01 AUTH][len=9][role=0x01 Standard][...8 key bytes][checksum][0xFF]
              const body = [0xA5, 0x01, 0x01, 0x09, 0x01, ...keyBytes];
              const checksum = body.reduce((acc, b) => acc ^ b, 0);
              const frame = new Uint8Array([...body, checksum, 0xFF]);
              const canFireAndForget = txCharacteristic.properties && txCharacteristic.properties.writeWithoutResponse;
              if (canFireAndForget) {
                await txCharacteristic.writeValueWithoutResponse(frame);
              } else {
                await txCharacteristic.writeValue(frame);
              }
              logToConsole(`UIFP AUTH sent (Standard role)`, 'success');
            } catch (e) {
              logToConsole(`Key send failed: ${e.message}`, 'error');
            }
          }
        } else if (keyInput && !isUifpTarget) {
          logToConsole('Key field ignored — only used for Plain BLE / Plain UART targets', 'warn');
        }

        statusPill.classList.add('connected');
        statusText.textContent = "Authenticated Link";

      } catch (err) {
        logToConsole(`Pairing Failed: ${err.message}`, 'error');
        // don't strand the user on a broken controls-view — send them back
        // to the connect screen and fully reset state so a retry starts clean
        resetToConnectView();
      }
    });

    function resetToConnectView() {
      stopUnlockHeartbeat();
      txCharacteristic = null;
      rxCharacteristic = null;
      gattServer = null;
      if (gattDevice && gattDevice.gatt && gattDevice.gatt.connected) {
        try { gattDevice.gatt.disconnect(); } catch (e) { /* already gone, ignore */ }
      }
      gattDevice = null;
      statusPill.classList.remove('connected');
      statusText.textContent = "Disconnected";
      document.getElementById('controls-view').classList.add('hidden');
      document.getElementById('connect-view').classList.remove('hidden');
      segwaySession = null;
    }

    // ================== Segway/Ninebot Real Protocol (Enc2) — EXPERIMENTAL ==================
    // Ported from https://nootnooot.codeberg.page/segway-ninebot-ble/ documentation.
    // CAVEAT: that project's own Python client explicitly states it has never
    // been tested against real hardware. This is a genuine first attempt to
    // validate the documented spec against real Segway/Ninebot devices —
    // treat every log line here as diagnostic evidence, not a guaranteed
    // working feature. Expect to need debugging against real captured traffic.
    let segwaySession = null; // { cryptoKey, authParam, counter, serialNumber } once authenticated

    function bytesToHex(bytes) {
      return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function waitForNotification(char, timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        const handler = (event) => {
          char.removeEventListener('characteristicvaluechanged', handler);
          clearTimeout(timer);
          resolve(new Uint8Array(event.target.value.buffer));
        };
        const timer = setTimeout(() => {
          char.removeEventListener('characteristicvaluechanged', handler);
          reject(new Error('Timeout waiting for device response'));
        }, timeoutMs);
        char.addEventListener('characteristicvaluechanged', handler);
      });
    }

    async function runSegwayHandshake() {
      if (!txCharacteristic || !rxCharacteristic) {
        logToConsole('Segway ENC2: not connected / write+notify characteristics not found', 'error');
        return;
      }
      const bleName = gattDevice.name || '';
      if (!bleName) {
        logToConsole('Segway ENC2: could not read BLE device name — required as key material for PRE_COMM', 'error');
        return;
      }
      logToConsole(`Segway ENC2: starting handshake using device name "${bleName}"...`, 'warn');
      logToConsole('Segway ENC2: EXPERIMENTAL — this protocol has not been confirmed against real hardware yet', 'warn');

      try {
        // ---- Phase 1: PRE_COMM (non-SN mode, counter = 0) ----
        const key1 = new TextEncoder().encode(bleName);
        let derivedBytes = await SegwayCrypto.deriveKey(key1, null);
        let cryptoKey = await SegwayCrypto.importAesKey(derivedBytes);

        const preCommPlain = new Uint8Array([0x5A, 0xA5, 0x00, 0x3E, 0x04, 0x5B, 0x00]);
        const preCommCipher = await SegwayCrypto.encryptNonSn(cryptoKey, preCommPlain);

        await txCharacteristic.writeValue(preCommCipher);
        logToConsole(`PRE_COMM sent: ${bytesToHex(preCommCipher)}`, 'warn');

        const preCommRespCipher = await waitForNotification(rxCharacteristic);
        const { plaintext: preCommRespPlain, checksumOk } = await SegwayCrypto.decryptNonSn(cryptoKey, preCommRespCipher);

        if (!checksumOk) {
          logToConsole('PRE_COMM response checksum FAILED — wrong device name, or this device speaks a different protocol generation', 'error');
          return;
        }
        logToConsole(`PRE_COMM response decrypted: ${bytesToHex(preCommRespPlain)}`, 'success');

        // Best-effort offset assumption: header(3) + target(1) + cmd(1) + index(1) = 6,
        // then auth_param[16] + serial[14] follow. This offset is NOT explicitly
        // confirmed byte-for-byte in the docs — flag clearly if it looks wrong.
        const dataStart = 6;
        if (preCommRespPlain.length < dataStart + 30) {
          logToConsole(`PRE_COMM response too short (${preCommRespPlain.length} bytes) to extract auth+serial at the assumed offset — frame layout assumption is likely wrong for this device`, 'error');
          return;
        }
        const authParam = preCommRespPlain.slice(dataStart, dataStart + 16);
        const serialBytes = preCommRespPlain.slice(dataStart + 16, dataStart + 30);
        const serialNumber = new TextDecoder().decode(serialBytes).replace(/\0/g, '');
        logToConsole(`Extracted auth_param: ${bytesToHex(authParam)}`, 'success');
        logToConsole(`Extracted serial number: ${serialNumber}`, 'success');

        // ---- Phase 2: SET_PWD (SN mode, counter starts at 1, increments to 2 for this frame) ----
        derivedBytes = await SegwayCrypto.deriveKey(key1, authParam);
        cryptoKey = await SegwayCrypto.importAesKey(derivedBytes);
        let counter = 2;

        const sessionPassword = await SegwayCrypto.generateSessionPassword(authParam);
        logToConsole(`Generated session password: ${bytesToHex(sessionPassword)}`, 'warn');

        const setPwdPayload = new Uint8Array(4 + 16);
        setPwdPayload.set([0x3E, 0x04, 0x5C, 0x00], 0);
        setPwdPayload.set(sessionPassword, 4);
        const setPwdPlain = new Uint8Array(3 + setPwdPayload.length);
        setPwdPlain.set([0x5A, 0xA5, setPwdPayload.length], 0);
        setPwdPlain.set(setPwdPayload, 3);

        const setPwdCipher = await SegwayCrypto.encryptSn(cryptoKey, setPwdPlain, counter, authParam);
        await txCharacteristic.writeValue(setPwdCipher);
        logToConsole('SET_PWD sent — if this is first-time pairing, press the physical button on the vehicle now (up to 60s)...', 'warn');

        const setPwdRespCipher = await waitForNotification(rxCharacteristic, 65000);
        const setPwdResp = await SegwayCrypto.decryptSn(cryptoKey, setPwdRespCipher, authParam);
        if (!setPwdResp.macOk) {
          logToConsole('SET_PWD response MAC verification FAILED', 'error');
          return;
        }
        const setPwdIndex = setPwdResp.plaintext[5];
        if (setPwdIndex !== 1) {
          logToConsole(`SET_PWD not accepted (index=${setPwdIndex}) — button not pressed in time, or device rejected the password`, 'error');
          return;
        }
        logToConsole('SET_PWD accepted!', 'success');

        // ---- Phase 3: AUTH (SN mode, counter increments to 3) ----
        derivedBytes = await SegwayCrypto.deriveKey(sessionPassword, authParam);
        cryptoKey = await SegwayCrypto.importAesKey(derivedBytes);
        counter = 3;

        const authPayload = new Uint8Array(4 + serialBytes.length);
        authPayload.set([0x3E, 0x04, 0x5D, 0x00], 0);
        authPayload.set(serialBytes, 4);
        const authPlain = new Uint8Array(3 + authPayload.length);
        authPlain.set([0x5A, 0xA5, authPayload.length], 0);
        authPlain.set(authPayload, 3);

        const authCipher = await SegwayCrypto.encryptSn(cryptoKey, authPlain, counter, authParam);
        await txCharacteristic.writeValue(authCipher);
        logToConsole('AUTH sent, waiting for response...', 'warn');

        const authRespCipher = await waitForNotification(rxCharacteristic);
        const authResp = await SegwayCrypto.decryptSn(cryptoKey, authRespCipher, authParam);
        if (!authResp.macOk) {
          logToConsole('AUTH response MAC verification FAILED', 'error');
          return;
        }
        const authIndex = authResp.plaintext[5];
        if (authIndex === 1) {
          logToConsole('AUTHENTICATED — Segway Enc2 session established!', 'success');
          segwaySession = { cryptoKey, authParam, counter, serialNumber };
        } else {
          logToConsole(`AUTH failed (index=${authIndex})`, 'error');
        }

      } catch (e) {
        logToConsole(`Segway ENC2 handshake error: ${e.message}`, 'error');
      }
    }

    function handleIncomingESCData(event) {
      const rawData = new Uint8Array(event.target.value.buffer);
      const hexStr = Array.from(rawData).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      logToConsole(`RX: ${hexStr}`);

      // Try UIFP parsing first — our own devices (micro:bit scooter, ESP32
      // smart lock, etc). See UIFP-protocol-spec.md for the frame layout.
      if (rawData[0] === 0xA5 && rawData.length >= 5) {
        const deviceType = rawData[1];
        const frameType = rawData[2];
        const length = rawData[3];
        if (rawData.length === 4 + length + 1) { // exact UIFP structure match
          const payload = rawData.slice(4, 4 + length);
          if (frameType === 0x03) { // TELEMETRY
            if (deviceType === 0x01) { // Scooter: speed (2 bytes LE) + battery
              const speed = (payload[0] | (payload[1] << 8)) / 1000;
              const battery = payload[2];
              document.getElementById('tele-speed').innerHTML = `${speed.toFixed(1)} <span style="font-size: 0.75rem;">km/h</span>`;
              document.getElementById('tele-battery').innerHTML = `${battery}<span style="font-size: 0.75rem;">%</span>`;
            } else if (deviceType === 0x02) { // Smart Lock: locked flag + battery
              const isLocked = payload[0] === 1;
              const battery = payload[1];
              logToConsole(`Lock status: ${isLocked ? 'LOCKED' : 'UNLOCKED'}, battery ${battery}%`, 'success');
              document.getElementById('tele-battery').innerHTML = `${battery}<span style="font-size: 0.75rem;">%</span>`;
            }
          } else if (frameType === 0x04) {
            logToConsole('ACK received', 'success');
          } else if (frameType === 0x05) {
            logToConsole(`NACK received (reason 0x${payload[0].toString(16)})`, 'error');
          }
          return;
        }
      }

      // Legacy/loose fallback for real third-party hardware or older sim builds
      if ((rawData[0] === 0x55 || rawData[0] === 0xA5) && rawData.length >= 8) {
        const speed = (rawData[6] | (rawData[7] << 8)) / 1000;
        const battery = rawData[8] || 100;
        document.getElementById('tele-speed').innerHTML = `${speed.toFixed(1)} <span style="font-size: 0.75rem;">km/h</span>`;
        document.getElementById('tele-battery').innerHTML = `${battery}<span style="font-size: 0.75rem;">%</span>`;
      }
    }

    async function dispatchMultiKey(actionName, silent = false) {
      if (!txCharacteristic) return;
      const brand = document.getElementById('scooter-brand-select').value;
      const profile = PROTOCOL_KEYS[brand] || PROTOCOL_KEYS.apex;
      const keySet = profile[actionName] || [];

      // Use write-without-response for the heartbeat when possible: it
      // fires and forgets instead of waiting for a write ack, which keeps
      // 100ms-interval heartbeats arriving on time. Falls back to the
      // normal (slower) writeValue if the characteristic doesn't support it.
      const canFireAndForget = txCharacteristic.properties &&
        txCharacteristic.properties.writeWithoutResponse;

      for (let key of keySet) {
        try {
          if (actionName === 'UNLOCK' && canFireAndForget) {
            await txCharacteristic.writeValueWithoutResponse(key);
          } else {
            await txCharacteristic.writeValue(key);
          }
          // silent=true skips the per-write log line — used for the 10x/sec
          // heartbeat spam so the console doesn't flood; errors still
          // always get logged below regardless of silent, since a failing
          // write is exactly what you'd want to know about.
          if (!silent) logToConsole(`TX [${actionName}] Key Dispatched`, 'success');
        } catch (e) {
          logToConsole(`TX Error: ${e.message}`, 'error');
        }
      }
    }

    // ---- Unlock heartbeat: hold the link open by spamming UNLOCK every 100ms.
    // LOCK doesn't send its own frame — it just cuts the heartbeat, and the
    // vehicle-side firmware is expected to fail back to locked once the
    // stream stops (same fail-safe pattern as the stock scooter app).
    let unlockHeartbeatId = null;

    function startUnlockHeartbeat() {
      if (unlockHeartbeatId) return;
      dispatchMultiKey('UNLOCK'); // fire immediately, log this one so you see it started
      unlockHeartbeatId = setInterval(() => dispatchMultiKey('UNLOCK', true), 100); // silent after that
      logToConsole('Unlock heartbeat started (every 100ms)', 'success');
      document.getElementById('btn-unlock').classList.add('btn-light-on');
    }

    function stopUnlockHeartbeat() {
      if (!unlockHeartbeatId) return;
      clearInterval(unlockHeartbeatId);
      unlockHeartbeatId = null;
      logToConsole('Unlock heartbeat stopped', 'warn');
      document.getElementById('btn-unlock').classList.remove('btn-light-on');
    }

    document.getElementById('btn-unlock').addEventListener('click', startUnlockHeartbeat);
    document.getElementById('btn-lock').addEventListener('click', stopUnlockHeartbeat);
    document.getElementById('btn-mode-eco').addEventListener('click', () => dispatchMultiKey('ECO'));
    document.getElementById('btn-mode-sport').addEventListener('click', () => dispatchMultiKey('SPORT'));
    document.getElementById('btn-horn').addEventListener('click', () => dispatchMultiKey('BEEP'));

    document.getElementById('btn-light').addEventListener('click', async () => {
      lightState = !lightState;
      const lightBtn = document.getElementById('btn-light');
      lightBtn.classList.toggle('btn-light-on', lightState);
      await dispatchMultiKey(lightState ? 'LIGHT_ON' : 'LIGHT_OFF');
    });

    document.getElementById('btn-send-raw').addEventListener('click', async () => {
      const rawHex = document.getElementById('raw-cmd-input').value.replace(/\s+/g, '');
      if (!rawHex) {
        logToConsole('Send Raw Hex: field is empty', 'error');
        return;
      }
      if (!txCharacteristic) {
        logToConsole('Send Raw Hex: not connected (no write characteristic)', 'error');
        return;
      }
      try {
        const bytes = new Uint8Array(rawHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const canFireAndForget = txCharacteristic.properties && txCharacteristic.properties.writeWithoutResponse;
        if (canFireAndForget) {
          await txCharacteristic.writeValueWithoutResponse(bytes);
        } else {
          await txCharacteristic.writeValue(bytes);
        }
        logToConsole(`TX Custom Frame: ${rawHex}`, 'warn');
      } catch (e) {
        logToConsole(`Send Raw Hex failed: ${e.message}`, 'error');
      }
    });

    document.getElementById('btn-segway-handshake').addEventListener('click', () => {
      runSegwayHandshake();
    });

    document.getElementById('btn-disconnect').addEventListener('click', () => {
      resetToConnectView();
    });
  </script>
</body>
</html>
